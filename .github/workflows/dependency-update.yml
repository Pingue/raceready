name: Dependency Update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Check requirements.txt for outdated or vulnerable Python packages.
            Update the version pins, install the updated dependencies, and run
            `pytest tests/ -v` to confirm nothing is broken. If tests fail because
            of an update, try to fix the code for the new package version; if you
            can't, revert that specific package's update and note why in the PR
            description. Commit the changes and open a pull request against main
            summarizing what was updated and why.
          claude_args: '--allowed-tools "Bash(git:*),Bash(pip:*),Bash(pytest:*)"'
